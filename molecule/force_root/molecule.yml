---
dependency:
  name: galaxy
  enabled: true
  options:
    ignore-certs: true
    ignore-errors: true
    role-file: >-
      ${MOLECULE_SCENARIO_DIRECTORY}/../resources/requirements.yml
    requirements-file: >-
      ${MOLECULE_SCENARIO_DIRECTORY}/../resources/requirements.yml

driver:
  name: podman

lint: ${MOLECULE_SCENARIO_DIRECTORY}/../resources/linters.sh

platforms:
  - name: el7-${INSTANCE_UUID:-1}
    image: quay.io/centos/centos:centos7
    dockerfile: ../resources/Dockerfile.j2
    groups:
      - molecule_hosts
      - molecule_hosts_el
      - molecule_hosts_el_7
  - name: el8-${INSTANCE_UUID:-1}
    image: rockylinux:8
    dockerfile: ../resources/Dockerfile.j2
    groups:
      - molecule_hosts
      - molecule_hosts_el
      - molecule_hosts_el_8
  - name: el9-${INSTANCE_UUID:-1}
    image: rockylinux:9
    dockerfile: ../resources/Dockerfile.j2
    groups:
      - molecule_hosts
      - molecule_hosts_el
      - molecule_hosts_el_9
  - name: fedora-${INSTANCE_UUID:-1}
    image: quay.io/fedora/fedora:latest
    dockerfile: ../resources/Dockerfile.j2
    groups:
      - molecule_hosts
      - molecule_hosts_fedora

provisioner:
  name: ansible
  playbooks:
    cleanup: ../resources/cleanup.yml
    side_effect: ../resources/side_effect.yml
  config_options:
    defaults:
      callbacks_enabled: profile_tasks
      action_plugins: $PWD/action_plugins
  inventory:
    hosts:
      molecule_hosts:
        vars:
          artifact_list:
            - id: noroot
              type: http
              host: file://
              path: /tmp
              file: noroot.zip
              dest: /var/tmp
              unarchive: true
              unarchive_creates: /var/tmp/noroot/level1
              unarchive_remove: true
              unarchive_force_root: noroot
              validate_certs: false
              no_log: false

            - id: root
              type: http
              host: file://
              path: /tmp
              file: root.zip
              dest: /var/tmp
              unarchive: true
              unarchive_creates: /var/tmp/root/level1
              unarchive_remove: true
              unarchive_force_root: root
              validate_certs: false
              no_log: false

verifier:
  name: ansible
